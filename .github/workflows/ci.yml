name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Catches dependency drift even during long gaps between commits.
  schedule:
    - cron: "0 9 1 * *" # 09:00 UTC, 1st of each month
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # A stalled compile is a failure mode this project has actually hit, so
    # cap the job rather than letting a hang burn the full 6h default.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci` (not `install`) installs the lockfile exactly and wipes
      # node_modules first — the thing that prevents a drifted or corrupt tree.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
