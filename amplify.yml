version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node --version
        - npm --version
        - npm ci --legacy-peer-deps --prefer-offline --no-audit --maxsockets=1
    build:
      commands:
        - npm run build
        - echo "Build completed successfully"
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    # Cache npm's download cache, NOT node_modules. `npm ci` deliberately wipes
    # node_modules and rebuilds from the lockfile; restoring a cached copy on
    # top of that can leave a half-merged tree (we hit exactly that: a package
    # present but missing its entry file). $HOME/.npm keeps builds fast without
    # undermining that guarantee.
    paths:
      - $HOME/.npm/**/*
      - .next/cache/**/*
